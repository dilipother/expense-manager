name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required for Android Gradle Plugin 8.x) ───────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Set up Flutter SDK ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # ── 4. Verify Flutter installation ───────────────────────────────────
      - name: Flutter version
        run: flutter --version

      # ── 5. Get pub dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 6. Run analyzer (non-blocking — warnings won't fail the build) ───
      - name: Analyze project
        run: flutter analyze --no-fatal-infos || true

      # ── 7. Build DEBUG APK (fast, good for testing) ───────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 8. Build RELEASE APKs split by ABI (smaller files) ───────────────
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      # ── 9. Build universal release APK (single file, all devices) ────────
      - name: Build universal release APK
        run: flutter build apk --release

      # ── 10. List built APKs ───────────────────────────────────────────────
      - name: List APK files
        run: |
          echo "=== Built APK files ==="
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec ls -lh {} \;

      # ── 11. Upload DEBUG APK as artifact ──────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── 12. Upload RELEASE APKs (split) as artifacts ─────────────────────
      - name: Upload release APKs (split by ABI)
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 90

      # ── 13. Upload UNIVERSAL release APK ─────────────────────────────────
      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # ── 14. Create GitHub Release on version tags (e.g. v1.0.0) ──────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          name: Expense Manager ${{ github.ref_name }}
          body: |
            ## Expense Manager ${{ github.ref_name }}

            ### Download
            | File | Device |
            |------|--------|
            | `app-release.apk` | All devices (universal) |
            | `app-arm64-v8a-release.apk` | Modern phones (recommended) |
            | `app-armeabi-v7a-release.apk` | Older phones |

            ### What's new
            - Personal expense & income tracking
            - Bank account & credit card management
            - Cash wallet with ATM withdrawal tracking
            - SMS-based transaction auto-import (Android)
            - Analytics with charts
            - Budget tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
